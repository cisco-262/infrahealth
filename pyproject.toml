[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrahealth"
version = "0.1.0"
description = "A lightweight Python CLI for infrastructure health checks."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
infrahealth = "infrahealth.cli:main"

[tool.setuptools.packages.find]
include = ["infrahealth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
